<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="TIME / WORLD CLOCK — international art-inspired global clock and aviation dashboard"><title>TIME / WORLD CLOCK</title><style>:root{--ink:#181714;--gold:#8a6a2f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#ddd6ca;color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif}body{display:grid;place-items:center;overflow:auto}.page{position:relative;width:min(100vw,1536px);aspect-ratio:3/2;overflow:hidden;background:#eee9df url("data:image/jpeg;base64,REPLACE_IMAGE") center/100% 100% no-repeat;box-shadow:0 24px 70px rgba(30,27,22,.22)}.hand{position:absolute;left:var(--x);top:var(--y);transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(var(--deg));border-radius:999px;background:#1e1e1d;z-index:5;box-shadow:0 1px 2px rgba(0,0,0,.3)}.hour{width:clamp(4px,.38vw,6px);height:7.2%}.minute{width:clamp(2px,.25vw,4px);height:9.4%}.second{width:1.5px;height:9.8%;background:var(--gold);box-shadow:none}.pin{position:absolute;left:var(--x);top:var(--y);width:clamp(10px,.9vw,15px);aspect-ratio:1;border-radius:50%;background:#9a7634;border:1px solid #4f3e21;transform:translate(-50%,-50%);z-index:6}.digital{position:absolute;left:var(--x);top:72.9%;transform:translateX(-50%);font-size:clamp(20px,2.45vw,37px);font-weight:300;letter-spacing:.05em;font-variant-numeric:tabular-nums;white-space:nowrap;color:#171717;z-index:7}.live-plane{position:absolute;left:58%;top:8%;z-index:8;font-size:clamp(20px,2vw,31px);color:#252525;animation:fly 9s ease-in-out infinite}@keyframes fly{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(5vw,1.4vw) rotate(2deg)}}.live-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#a17b35;box-shadow:0 0 0 4px rgba(161,123,53,.13),0 0 12px rgba(161,123,53,.6);z-index:8;animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.35);opacity:.72}}.a11{--x:16.1%;--y:46.9%}.a22{--x:36.2%;--y:47.1%}.a33{--x:60.9%;--y:47.1%}.a44{--x:81.9%;--y:46.9%}@media(max-width:560px){.page{width:100vw}.digital{font-size:clamp(10px,3.1vw,18px)}.live-plane{font-size:18px}}</style></head><body><main class="page" aria-label="International world clock and aviation dashboard"><i class="hand hour a11" id="h0"></i><i class="hand minute a11" id="m0"></i><i class="hand second a11" id="s0"></i><b class="pin a11"></b><i class="hand hour a22" id="h1"></i><i class="hand minute a22" id="m1"></i><i class="hand second a22" id="s1"></i><b class="pin a22"></b><i class="hand hour a33" id="h2"></i><i class="hand minute a33" id="m2"></i><i class="hand second a33" id="s2"></i><b class="pin a33"></b><i class="hand hour a44" id="h3"></i><i class="hand minute a44" id="m3"></i><i class="hand second a44" id="s3"></i><b class="pin a44"></b><div id="d0" class="digital" style="--x:16.2%"></div><div id="d1" class="digital" style="--x:36.2%"></div><div id="d2" class="digital" style="--x:60.9%"></div><div id="d3" class="digital" style="--x:81.9%"></div><div class="live-plane">✈</div><div class="live-dot" style="left:35.7%;top:31%"></div><div class="live-dot" style="left:61.4%;top:17%"></div><div class="live-dot" style="left:77.2%;top:49%"></div></main><script>const zones=[['Europe/London',0],['America/New_York',1],['Asia/Tokyo',2],['Europe/Moscow',3]];function get(z){const p=new Intl.DateTimeFormat('en-GB',{timeZone:z,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date()),o={};p.forEach(x=>o[x.type]=+x.value||0);return o}function off(z){const now=new Date(),u=new Intl.DateTimeFormat('en-US',{timeZone:'UTC',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(now).reduce((a,x)=>(a[x.type]=x.value,a),{}),t=new Intl.DateTimeFormat('en-US',{timeZone:z,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(now).reduce((a,x)=>(a[x.type]=x.value,a),{}),a=Date.UTC(+u.year,+u.month-1,+u.day,+u.hour,+u.minute),b=Date.UTC(+t.year,+t.month-1,+t.day,+t.hour,+t.minute),n=Math.round((b-a)/36e5);return 'GMT'+(n>=0?'+':'')+n}function tick(){zones.forEach(([z,i])=>{const p=get(z),min=p.minute+p.second/60,hr=p.hour%12+min/60;document.getElementById('h'+i).style.setProperty('--deg',hr*30+'deg');document.getElementById('m'+i).style.setProperty('--deg',min*6+'deg');document.getElementById('s'+i).style.setProperty('--deg',p.second*6+'deg');document.getElementById('d'+i).textContent=String(p.hour).padStart(2,'0')+':'+String(p.minute).padStart(2,'0')+':'+String(p.second).padStart(2,'0')+'  '+off(z)})}tick();setInterval(tick,1000)</script></body></html>
