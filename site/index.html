<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Luxury world clock and aviation dashboard.">
<title>TIME / WORLD CLOCK</title>
<style>
:root{--gold:#e6b957;--gold2:#ffe0a0;--bg:#080908}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#050605;color:#fff;font-family:"Helvetica Neue",Arial,sans-serif}body{display:grid;place-items:center;overflow:auto}.page{position:relative;width:min(100vw,1535px);aspect-ratio:1535/1024;overflow:hidden;background:#090a09 url("background.png") center/100% 100% no-repeat;box-shadow:0 30px 100px #000}.overlay{position:absolute;inset:0;pointer-events:none}.clock{position:absolute;width:17.1%;aspect-ratio:1;border-radius:50%;z-index:5}.q1{left:7.2%;top:34.0%}.q2{left:28.1%;top:34.0%}.q3{left:51.2%;top:34.0%}.q4{left:73.2%;top:34.0%}.hand{position:absolute;left:50%;top:50%;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(var(--deg));border-radius:99px;z-index:8;filter:drop-shadow(0 2px 2px #000)}.hour{width:5px;height:27%;background:linear-gradient(90deg,#8e887e,#fff2d2 48%,#81776a)}.minute{width:3px;height:37%;background:linear-gradient(90deg,#837c70,#f4e8cf 48%,#756b60)}.second{width:1.5px;height:41%;background:var(--gold2);filter:drop-shadow(0 0 4px #d9ad54)}.pin{position:absolute;left:50%;top:50%;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 30% 25%,#fff0bd,#a8782d 72%);border:1px solid #5e441f;z-index:9;box-shadow:0 1px 4px #000}.digital{position:absolute;z-index:7;top:68.0%;width:17.1%;text-align:center;font:300 clamp(18px,2.25vw,34px)/1 "Courier New",monospace;letter-spacing:.03em;color:#f5f0e8;text-shadow:0 2px 8px #000}.d1{left:7.2%}.d2{left:28.1%}.d3{left:51.2%}.d4{left:73.2%}.plane{position:absolute;left:65.5%;top:3.4%;z-index:12;color:var(--gold2);font-size:clamp(24px,2.3vw,36px);filter:drop-shadow(0 0 8px #e8bd64);animation:fly 8s ease-in-out infinite}@keyframes fly{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(42px,-8px) rotate(3deg)}}.route-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#f4c86f;box-shadow:0 0 0 4px #e7b34a22,0 0 16px #e7b34aaa;z-index:11;animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.45);opacity:.6}}.dota{left:35.7%;top:31%}.dotb{left:61.4%;top:17%}.dotc{left:77.2%;top:49%}.status{position:absolute;left:16.3%;top:76.0%;width:50.4%;height:20.2%;z-index:6;border:1px solid #d9ac55aa;border-radius:8px;background:#060706c7;box-shadow:inset 0 0 25px #000;backdrop-filter:blur(1px);padding:1.4% 1.6%;font-size:clamp(7px,.73vw,11px);letter-spacing:.06em}.status-title{font-size:clamp(10px,1vw,15px);letter-spacing:.2em;margin-bottom:1%;color:#f2eee7}.status-title b{color:var(--gold);font-weight:400}.status table{width:100%;border-collapse:collapse}.status th{text-align:left;color:var(--gold);font-weight:400;padding:4px;border-bottom:1px solid #d9ac5544}.status td{padding:5px 4px;border-bottom:1px solid #fff1}.ok{color:#87cf62}.delay{color:#e4ad40}.compass{position:absolute;left:67.0%;top:75.8%;width:13.2%;aspect-ratio:1;border-radius:50%;z-index:7}.compass-plane{position:absolute;inset:0;display:grid;place-items:center;color:var(--gold2);font-size:clamp(32px,3.2vw,50px);filter:drop-shadow(0 3px 5px #000);animation:compass 5s ease-in-out infinite}@keyframes compass{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(4deg)}}
@media(max-width:700px){body{align-items:flex-start}.page{width:100vw;min-height:100vh;aspect-ratio:auto;background-size:100% auto;background-position:top center}.clock{width:19%;}.digital{font-size:clamp(11px,2.7vw,20px)}.status{left:16%;width:51%;font-size:5px}.plane{font-size:24px}}
</style>
</head>
<body>
<main class="page" aria-label="Luxury world clock and aviation dashboard">
<div class="overlay">
<div class="clock q1"><i class="hand hour"></i><i class="hand minute"></i><i class="hand second"></i><b class="pin"></b></div>
<div class="clock q2"><i class="hand hour"></i><i class="hand minute"></i><i class="hand second"></i><b class="pin"></b></div>
<div class="clock q3"><i class="hand hour"></i><i class="hand minute"></i><i class="hand second"></i><b class="pin"></b></div>
<div class="clock q4"><i class="hand hour"></i><i class="hand minute"></i><i class="hand second"></i><b class="pin"></b></div>
<div class="digital d1"></div><div class="digital d2"></div><div class="digital d3"></div><div class="digital d4"></div>
<div class="plane">✈</div><i class="route-dot dota"></i><i class="route-dot dotb"></i><i class="route-dot dotc"></i>
<div class="status"><div class="status-title">WORLD FLIGHT STATUS <b>✈</b></div><table><thead><tr><th>TIME</th><th>FLIGHT</th><th>FROM</th><th>TO</th><th>STATUS</th><th>GATE</th></tr></thead><tbody><tr><td>09:15</td><td>LH 247</td><td>LONDON (LHR)</td><td>NEW YORK (JFK)</td><td class="ok">ON TIME</td><td>A12</td></tr><tr><td>17:30</td><td>NH 108</td><td>TOKYO (NRT)</td><td>LONDON (LHR)</td><td class="ok">ON TIME</td><td>B07</td></tr><tr><td>11:05</td><td>SU 245</td><td>MOSCOW (SVO)</td><td>NEW YORK (JFK)</td><td class="ok">ON TIME</td><td>C03</td></tr><tr><td>21:40</td><td>QF 1</td><td>SYDNEY (SYD)</td><td>LONDON (LHR)</td><td class="delay">DELAYED</td><td>D11</td></tr></tbody></table></div>
<div class="compass"><div class="compass-plane">✈</div></div>
</div>
</main>
<script>
const zones=['Europe/London','America/New_York','Asia/Tokyo','Europe/Moscow'];
const clocks=document.querySelectorAll('.clock'),digits=document.querySelectorAll('.digital');
function getParts(zone){const p=new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,hourCycle:'h23'}).formatToParts(new Date()),o={};p.forEach(x=>o[x.type]=Number(x.value)||0);return o}
function render(){zones.forEach((zone,i)=>{const t=getParts(zone),m=t.minute+t.second/60,h=(t.hour%12)+m/60;clocks[i].querySelector('.hour').style.setProperty('--deg',h*30+'deg');clocks[i].querySelector('.minute').style.setProperty('--deg',m*6+'deg');clocks[i].querySelector('.second').style.setProperty('--deg',t.second*6+'deg');digits[i].textContent=String(t.hour).padStart(2,'0')+':'+String(t.minute).padStart(2,'0')+':'+String(t.second).padStart(2,'0')})}
render();setInterval(render,1000);
</script>
</body></html>
