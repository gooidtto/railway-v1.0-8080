<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="TIME / WORLD CLOCK — international art-inspired global clock and aviation dashboard">
<title>TIME / WORLD CLOCK</title>
<style>
:root{--paper:#ece8df;--ink:#1c1b19;--gold:#9b7735;--gold2:#c09a50;--line:rgba(126,96,42,.55)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#d9d3c8;color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif}body{display:grid;place-items:center;overflow:auto}
.page{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;overflow:hidden;background:#ece8df url("background.webp") center/100% 100% no-repeat;box-shadow:0 24px 70px rgba(30,27,22,.22)}
/* The supplied artwork is the fixed visual layer. Only the clock faces and live data below are transparent functional overlays. */
.clock{position:absolute;top:33.4%;width:18.2%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 30%,#f7f4ed 0,#efebe2 68%,#ddd7cc 100%);border:1px solid rgba(60,55,48,.7);box-shadow:inset 0 0 0 2px rgba(255,255,255,.65),0 8px 18px rgba(40,35,28,.22);z-index:4}
.c1{left:7.1%}.c2{left:27.2%}.c3{left:50.6%}.c4{left:73.6%}
.clock .ticks{position:absolute;inset:4.5%;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(86,70,46,.75) 0deg 1deg,transparent 1deg 6deg);mask:radial-gradient(circle,transparent 0 88%,#000 89%)}
.clock .numbers{position:absolute;inset:0;font-size:clamp(11px,1.35vw,20px);font-weight:400}.clock .numbers span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.n12{transform:translate(-50%,-50%) translateY(-39%)}.n1{transform:translate(-50%,-50%) translate(21%,-36%)}.n2{transform:translate(-50%,-50%) translate(36%,-20%)}.n3{transform:translate(-50%,-50%) translateX(39%)}.n4{transform:translate(-50%,-50%) translate(35%,20%)}.n5{transform:translate(-50%,-50%) translate(20%,35%)}.n6{transform:translate(-50%,-50%) translateY(39%)}.n7{transform:translate(-50%,-50%) translate(-20%,35%)}.n8{transform:translate(-50%,-50%) translate(-35%,20%)}.n9{transform:translate(-50%,-50%) translateX(-39%)}.n10{transform:translate(-50%,-50%) translate(-36%,-20%)}.n11{transform:translate(-50%,-50%) translate(-21%,-36%)}
.hand{position:absolute;left:50%;top:50%;transform-origin:50% 100%;border-radius:4px;background:#20201f;z-index:5;box-shadow:0 1px 2px rgba(0,0,0,.3)}.hour{width:4px;height:27%}.minute{width:3px;height:36%}.second{width:1px;height:39%;background:var(--gold)}.pin{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#9a7634;border:1px solid #4f3e21;transform:translate(-50%,-50%);z-index:6}
.clock-info{position:absolute;top:67.2%;width:20%;text-align:center;z-index:5}.i1{left:6.1%}.i2{left:26.2%}.i3{left:49.6%}.i4{left:72.6%}.city{font-size:clamp(12px,1.45vw,22px);letter-spacing:.16em;font-weight:500}.digital{margin-top:2.4%;font-size:clamp(20px,2.45vw,37px);letter-spacing:.05em;font-weight:300;font-variant-numeric:tabular-nums}.gmt{margin-top:1.1%;font-size:clamp(9px,.9vw,14px);letter-spacing:.18em;color:#765a29}
.live-plane{position:absolute;left:58%;top:8%;z-index:6;font-size:clamp(20px,2vw,31px);color:#252525;animation:fly 9s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}@keyframes fly{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(5vw,1.4vw) rotate(2deg)}}
.live-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 4px rgba(155,119,53,.13),0 0 12px rgba(155,119,53,.6);z-index:6;animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.35);opacity:.72}}
.flight-time{position:absolute;left:17.1%;top:83.7%;width:53%;height:11%;z-index:5;display:grid;grid-template-columns:1fr 1.1fr 1.7fr 1.7fr 1.15fr .75fr;align-items:center;padding:3.1% 1.8%;font-size:clamp(7px,.75vw,12px);letter-spacing:.08em;color:#292824}.flight-time span{white-space:nowrap}.flight-time .ok{color:#607b4b}.flight-time .delay{color:#9b7735}
@media(max-width:900px){.page{width:100vw;height:auto;min-height:66.6667vw}.flight-time{font-size:clamp(5px,1.1vw,9px)}}
@media(max-width:560px){body{display:block}.page{width:100vw;height:66.6667vw;min-height:360px}.clock{border-width:1px}.clock .numbers{font-size:clamp(7px,2vw,12px)}.clock-info{top:67%}.digital{font-size:clamp(10px,3.1vw,18px)}.city{font-size:clamp(7px,1.8vw,11px)}.gmt{font-size:clamp(5px,1.3vw,8px)}.flight-time{display:none}.live-plane{font-size:18px}}
</style>
</head>
<body>
<main class="page" aria-label="International world clock and aviation dashboard">
  <div class="clock c1"><div class="ticks"></div><div class="numbers"><span class="n12">12</span><span class="n1">1</span><span class="n2">2</span><span class="n3">3</span><span class="n4">4</span><span class="n5">5</span><span class="n6">6</span><span class="n7">7</span><span class="n8">8</span><span class="n9">9</span><span class="n10">10</span><span class="n11">11</span></div><i class="hand hour"></i><i class="hand minute"></i><i class="hand second"></i><b class="pin"></b></div>
  <div class="clock c2"><div class="ticks"></div><div class="numbers"><span class="n12">12</span><span class="n1">1</span><span class="n2">2</span><span class="n3">3</span><span class="n4">4</span><span class="n5">5</span><span class="n6">6</span><span class="n7">7</span><span class="n8">8</span><span class="n9">9</span><span class="n10">10</span><span class="n11">11</span></div><i class="hand hour"></i><i class="hand minute"></i><i class="hand second"></i><b class="pin"></b></div>
  <div class="clock c3"><div class="ticks"></div><div class="numbers"><span class="n12">12</span><span class="n1">1</span><span class="n2">2</span><span class="n3">3</span><span class="n4">4</span><span class="n5">5</span><span class="n6">6</span><span class="n7">7</span><span class="n8">8</span><span class="n9">9</span><span class="n10">10</span><span class="n11">11</span></div><i class="hand hour"></i><i class="hand minute"></i><i class="hand second"></i><b class="pin"></b></div>
  <div class="clock c4"><div class="ticks"></div><div class="numbers"><span class="n12">12</span><span class="n1">1</span><span class="n2">2</span><span class="n3">3</span><span class="n4">4</span><span class="n5">5</span><span class="n6">6</span><span class="n7">7</span><span class="n8">8</span><span class="n9">9</span><span class="n10">10</span><span class="n11">11</span></div><i class="hand hour"></i><i class="hand minute"></i><i class="hand second"></i><b class="pin"></b></div>

  <section class="clock-info i1"><div class="city">LONDON</div><div class="digital"></div><div class="gmt"></div></section>
  <section class="clock-info i2"><div class="city">NEW YORK</div><div class="digital"></div><div class="gmt"></div></section>
  <section class="clock-info i3"><div class="city">TOKYO</div><div class="digital"></div><div class="gmt"></div></section>
  <section class="clock-info i4"><div class="city">MOSCOW</div><div class="digital"></div><div class="gmt"></div></section>

  <div class="live-plane">✈</div>
  <div class="live-dot" style="left:35.7%;top:31%"></div><div class="live-dot" style="left:61.4%;top:17%"></div><div class="live-dot" style="left:77.2%;top:49%"></div>
  <div class="flight-time"><span>09:15</span><span>LH 247</span><span>LONDON (LHR)</span><span>NEW YORK (JFK)</span><span class="ok">ON TIME</span><span>A12</span><span>17:30</span><span>NH 108</span><span>TOKYO (NRT)</span><span>LONDON (LHR)</span><span class="ok">ON TIME</span><span>B07</span><span>11:05</span><span>SU 245</span><span>MOSCOW (SVO)</span><span>NEW YORK (JFK)</span><span class="ok">ON TIME</span><span>C03</span><span>21:40</span><span>QF 1</span><span>SYDNEY (SYD)</span><span>LONDON (LHR)</span><span class="delay">DELAYED</span><span>D11</span></div>
</main>
<script>
const zones=[['Europe/London','.c1','.i1'],['America/New_York','.c2','.i2'],['Asia/Tokyo','.c3','.i3'],['Europe/Moscow','.c4','.i4']];
function parts(zone){const now=new Date();const p=new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(now);const o={};p.forEach(x=>o[x.type]=x.value);return {h:+o.hour%24,m:+o.minute,s:+o.second,text:`${o.hour}:${o.minute}:${o.second}`}}
function offset(zone){const now=new Date();const a=new Intl.DateTimeFormat('en-US',{timeZone:'UTC',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(now).reduce((x,y)=>(x[y.type]=y.value,x),{});const b=new Intl.DateTimeFormat('en-US',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(now).reduce((x,y)=>(x[y.type]=y.value,x),{});const u=Date.UTC(+a.year,+a.month-1,+a.day,+a.hour,+a.minute);const z=Date.UTC(+b.year,+b.month-1,+b.day,+b.hour,+b.minute);const n=Math.round((z-u)/3600000);return `GMT${n>=0?'+':''}${n}`}
function render(){zones.forEach(([zone,cs,is],idx)=>{const t=parts(zone), el=document.querySelector(cs), info=document.querySelector(is);el.querySelector('.hour').style.transform=`translate(-50%,-100%) rotate(${t.h%12*30+t.m*.5}deg)`;el.querySelector('.minute').style.transform=`translate(-50%,-100%) rotate(${t.m*6+t.s*.1}deg)`;el.querySelector('.second').style.transform=`translate(-50%,-100%) rotate(${t.s*6}deg)`;info.querySelector('.digital').textContent=t.text;info.querySelector('.gmt').textContent=offset(zone)})}
render();setInterval(render,1000);
</script>
</body></html>
